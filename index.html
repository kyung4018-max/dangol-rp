const QF={t:"QR코드 공유 안내",sit:"가족분들은 함께 오지 않았어요. 고객님께 QR코드를 가족분들께 공유해서 단골 등록하도록 안내해 보세요.",ph:"가족분들께 QR코드를 공유해 등록하도록 안내하는 멘트를 입력해 보세요",cu:"좋아요, 가족들한테 전해볼게요. 어떻게 하면 되나요?",
c:[["QR코드 공유 안내",/QR|큐알|큐아르/i,"가족에게 보낼 대상을 분명히 해 주세요. 예) “이 QR코드를 가족분들께 공유해 주세요.”","QR코드를 가족에게 공유하도록 분명히 안내했어요."],
["공유 방법 안내",/공유|보내|전달|캡처|저장|링크|카톡|메시지|문자/,"어떻게 보내면 되는지 알려 주세요. 예) “카톡으로 보내시면 돼요.”","가족에게 보내는 방법을 알려줘 바로 실행할 수 있어요."],
["가족의 단골 등록 목적 안내",/등록|가입|단골/,"가족분들이 무엇을 하게 되는지 알려 주세요. 예) “가족분들도 스캔하시면 바로 단골 등록이 돼요.”","가족도 스캔하면 단골 등록이 된다는 목적을 말했어요."],
["친절한 도움·혜택 표현",/도와|알려|안내|감사|선물|충전기|혜택/,"어려워하면 돕겠다는 말이나 혜택을 덧붙여 보세요. 예) “어려우시면 저희가 도와드릴게요.”","도움 제안이나 혜택으로 가족 등록을 쉽게 만들었어요."]],
m:"그럼 이 QR코드를 가족분들께 카톡으로 공유해 주세요. 가족분들이 휴대폰 카메라로 스캔하면 바로 단골 등록이 되고, 등록하시면 고속 충전기 선물도 받으실 수 있어요. 어려우시면 저희가 도와드릴게요."};
function sect(title,d,v,m,two){const g=d.rs.filter(x=>x.ok),n=d.rs.filter(x=>!x.ok);
return (two?'<h4 style="font-size:15px;color:#6c4ce0;margin-top:18px">'+title+' · '+d.p+'점</h4>':'')+'<div class="note">'+esc(d.sum)+'</div>'+
'<h4>내 멘트</h4><div class="mine">'+esc(v)+'</div>'+
'<h4>✅ 잘한 점</h4><ul>'+(g.length?g.map(x=>'<li><b>'+esc(x.l)+'</b><br>'+esc(x.good)+'</li>').join(""):'<li>아직 없어요. 아래 보완할 점부터 챙겨 보세요.</li>')+'</ul>'+
'<h4>🔧 보완할 점</h4><ul>'+(n.length?n.map(x=>'<li><b>'+esc(x.l)+'</b><br>'+esc(x.tip)+'</li>').join(""):'<li>모든 요소를 충족했어요!</li>')+'</ul>'+
'<h4>📝 모범 예시 (참고용)</h4><div class="mod">“'+esc(m)+'”</div>'}
function report(){const L=last,two=!!L.d2;
const h=two?'<div class="sc">종합 '+Math.round(L.d.p*0.7+L.d2.p*0.3)+'점 <small>(권유 '+L.d.p+'점 70% · '+L.q.t+' '+L.d2.p+'점 30%)</small></div>':'<div class="sc">'+L.d.p+'점 <small>('+L.d.k+'/'+L.d.rs.length+')</small></div>';
return h+sect("1단계 · 권유 멘트",L.d,L.v,L.s.m,two)+(two?sect("2단계 · "+L.q.t,L.d2,L.v2,L.q.m,two):'')+'<div class="note" style="color:#6b6580;margin-top:10px">워크시트 예시는 참고용이에요. 표현이 달라도 취지가 맞으면 좋은 멘트예요.</div><div id="aib"></div>'}
function textOf(){const L=last,nm=$("nm").value.trim()||"(이름 미입력)";
let t="이름: "+nm+"\n["+L.s.t+"] "+L.d.p+"점\n내 멘트: "+L.v+"\n\n"+L.d.sum+"\n";
t+="\n✅ 잘한 점\n"+(L.d.rs.filter(x=>x.ok).map(x=>"- "+x.good).join("\n")||"- (없음)");
t+="\n\n🔧 보완할 점\n"+(L.d.rs.filter(x=>!x.ok).map(x=>"- "+x.l+": "+x.tip).join("\n")||"- 모두 충족");
if(L.ai)t+="\n\n🤖 Claude 피드백("+L.ai.score+"점)\n"+L.ai.feedback+(L.ai.specific?"\n"+L.ai.specific.map(x=>"- "+x).join("\n"):"")+"\n개선 예시: "+L.ai.improved;
return t}
function base(s,v){return "당신은 통신 매장 판매 교육 강사입니다. 아래 '단골 등록 권유 멘트'를 평가해 주세요.\n워크시트 예시는 참고용이며 정답이 아닙니다. 표현이 달라도 취지(고객에게 돌아가는 이익 설명, 부담 없는 자연스러운 톤, '저희 매장 단골' 등록 제안, 구체적인 혜택·수치)를 충족하면 인정하고, 상황 적합성·자연스러움·고객 입장까지 종합해서 판단해 주세요.\n\n상황: "+s.sit+"\n유형 목표: "+s.goal+"\n워크시트 예시(참고용): "+s.m+"\n교육생 멘트: "+v+"\n\n"}
const ask=(s,v)=>base(s,v)+"다음 형식으로 한국어로 답해 주세요: 1) 점수(100점 만점) 2) 잘한 점(멘트의 구체적인 표현을 인용) 3) 아쉬운 점(어떤 표현을 어떻게 바꾸면 좋은지) 4) 더 나은 멘트 예시 1개";
async function judge(s,v){const r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:base(s,v)+'JSON만 출력하세요(설명·코드블록 금지): {"score":0~100 정수,"feedback":"총평 2~3문장","specific":["멘트의 구체적 표현을 인용한 지적 3~4개"],"improved":"더 나은 멘트 1개"}'})});
if(!r.ok)throw 0;const j=await r.json();if(typeof j.score!=="number")throw 0;return j}
async function makeImgOf(sub,html){const c=document.createElement("div");
c.style.cssText="position:absolute;left:-9999px;top:0;width:380px;padding:16px;background:#fff;color:#25203a;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;line-height:1.5";
c.innerHTML='<div style="font-weight:800;font-size:16px;color:#6c4ce0">🐶 단골 등록 권유 멘트 RP</div><div style="font-weight:700;margin:4px 0 8px">'+esc($("nm").value.trim()||"(이름 미입력)")+' · '+esc(sub)+'</div><div id="rep">'+html+'</div>';
document.body.appendChild(c);const cv=await html2canvas(c,{scale:2,backgroundColor:"#ffffff"});c.remove();
const bl=await new Promise(r=>cv.toBlob(r,"image/png"));return {bl,url:cv.toDataURL("image/png")}}
const makeImg=()=>makeImgOf(last.s.t,$("rep").innerHTML);
async function copy(t,o,msg){try{await navigator.clipboard.writeText(t);o.textContent=msg}catch(e){o.innerHTML="";const a=document.createElement("textarea");a.value=t;a.readOnly=true;a.style.marginTop="8px";o.appendChild(document.createTextNode("아래 글을 길게 눌러 복사해 주세요."));o.appendChild(a);a.focus();a.select()}}
function allHTML(){let sum=0,cnt=0;
const rows=S.map((s,i)=>{const R=results[i];if(!R)return '<div class="ri"><b>'+esc(s.t)+'</b> <span style="color:#6b6580">· 아직 안 했어요</span></div>';
const sc=R.d2?Math.round(R.d.p*0.7+R.d2.p*0.3):R.d.p;sum+=sc;cnt++;
const miss=R.d.rs.filter(x=>!x.ok).map(x=>x.l).concat(R.d2?R.d2.rs.filter(x=>!x.ok).map(x=>x.l):[]);
return '<div class="ri"><b>'+esc(s.t)+' · '+sc+'점</b> <small style="color:#6b6580">('+(R.d2?'권유 '+R.d.p+'점 70% · '+esc(R.qt)+' '+R.d2.p+'점 30%':'권유 '+R.d.p+'점')+')</small>'+
'<div class="mine">'+esc(R.v)+(R.d2?'\n'+esc(R.v2):'')+'</div>'+
'<div class="note">'+(miss.length?'🔧 보완할 점: '+esc(miss.join(', ')):'✅ 모든 항목을 충족했어요!')+'</div></div>'}).join("");
return '<div class="sc">평균 '+(cnt?Math.round(sum/cnt):0)+'점 <small>('+cnt+'/'+S.length+' 완료)</small></div><div class="note" style="color:#6b6580">각 유형 점수(1단계 70% + 2단계 30%)의 평균이에요.</div>'+rows}
function showAll(){["inp","st2","fb"].forEach(i=>$(i).hidden=true);$("allv").hidden=false;$("allrep").innerHTML=allHTML();$("imo2").innerHTML="";tabs();
pre2=makeImgOf("전체 결과",$("allrep").innerHTML).catch(()=>null);$("allv").scrollIntoView({behavior:"smooth"})}
const askRe=/단골|등록/;
async function showResult(){const L=last;results[cur]={v:L.v,d:L.d,v2:L.v2||null,d2:L.d2||null,qt:L.q.t};persist();tabs();$("inp").hidden=true;$("st2").hidden=true;$("fb").hidden=false;$("rep").innerHTML=report();$("imo").innerHTML="";
$("fb").scrollIntoView({behavior:"smooth"});
if(AI_URL){$("aib").innerHTML='<div class="note">🤖 Claude가 평가하는 중…</div>';
try{const a=await judge(L.s,L.v);L.ai=a;$("aib").innerHTML='<h4>🤖 Claude 피드백 (1단계 · '+esc(a.score)+'점)</h4><div class="note">'+esc(a.feedback)+'</div><ul>'+(a.specific||[]).map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul><h4>✨ 개선 예시</h4><div class="mod">“'+esc(a.improved)+'”</div>'}catch(e){$("aib").innerHTML=""}}
pre=makeImg().catch(()=>null)}
$("go").onclick=()=>{const v=$("ta").value.trim();if(!v)return;const s=S[cur],d=evaluate(s,v);last={s,v,d,q:cur===3?QF:Q};bub("me",v);
if(askRe.test(v)){const q=last.q;bub("cu",q.cu);$("inp").hidden=true;$("st2g").textContent="2단계 · "+q.t;$("st2s").textContent=q.sit;$("ta2").placeholder=q.ph;$("st2").hidden=false;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();$("st2").scrollIntoView({behavior:"smooth",block:"start"});return}
bub("cu",pick(d.p>=80?R.hi:d.p>=50?R.mid:R.lo));showResult()};
$("go2").onclick=()=>{const v2=$("ta2").value.trim();if(!v2)return;const d2=evaluate(last.q,v2,20);last.v2=v2;last.d2=d2;bub("me",v2);showResult()};
$("sk").onclick=()=>{last.d2=null;showResult()};
async function shareImg(pr,o){o.textContent="준비 중…";const r=await pr;
if(!r){o.textContent="이미지 생성에 실패했어요. 휴대폰 화면 캡처를 이용해 주세요.";return}
const f=new File([r.bl],"단골등록RP결과.png",{type:"image/png"});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"단골 등록 RP 전체 결과"});o.textContent="";return}}catch(e){if(e&&e.name==="AbortError"){o.textContent="";return}}
try{await navigator.clipboard.write([new ClipboardItem({"image/png":r.bl})]);o.textContent="✅ 이미지가 복사됐어요. 카톡 등 입력창에 붙여넣기 해 주세요.";return}catch(e){}
o.innerHTML="";const i=document.createElement("img");i.src=r.url;i.style.cssText="width:100%;margin-top:8px;border-radius:10px;border:1px solid #e3d9f3";o.appendChild(i);o.appendChild(document.createTextNode("이 환경에서는 바로 공유가 막혀 있어요. 이미지를 길게 눌러 저장·공유해 주세요."))}
async function saveImg(pr,o){o.textContent="준비 중…";const r=await pr;
if(!r){o.textContent="이미지 생성에 실패했어요. 휴대폰 화면 캡처를 이용해 주세요.";return}
o.innerHTML="";
try{const a=document.createElement("a");a.href=URL.createObjectURL(r.bl);a.download="단골등록RP결과.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
o.appendChild(document.createTextNode("✅ 이미지 저장을 시작했어요. 다운로드 폴더(또는 사진)를 확인해 주세요. 저장이 안 되면 아래 이미지를 길게 눌러 저장해 주세요."))}
catch(e){o.appendChild(document.createTextNode("이미지를 길게 눌러 저장해 주세요."))}
const i=document.createElement("img");i.src=r.url;i.style.cssText="width:100%;margin-top:8px;border-radius:10px;border:1px solid #e3d9f3";o.appendChild(i)}
$("im").onclick=()=>saveImg(pre,$("imo"));
$("im2").onclick=()=>shareImg(pre2,$("imo2"));
$("all").onclick=showAll;
$("rs").onclick=()=>{if(!confirm("모든 유형의 결과를 지우고 처음부터 시작할까요?"))return;results={};persist();load(0)};
$("re").onclick=()=>load(cur);$("nx").onclick=()=>load((cur+1)%S.length);
load(0);
</script></body></html>
