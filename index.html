<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단골 등록 권유 RP</title>
<style>
:root{--bg:#f6f0fb;--card:#fff;--tx:#25203a;--sub:#6b6580;--pri:#6c4ce0;--ln:#e3d9f3;--ok:#1f9d63;--no:#c0453d;--cu:#ece6f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131f;--card:#241e33;--tx:#f0ecf8;--sub:#a79fbd;--ln:#3a3050;--cu:#2f2742}}
:root[data-theme="dark"]{--bg:#17131f;--card:#241e33;--tx:#f0ecf8;--sub:#a79fbd;--ln:#3a3050;--cu:#2f2742}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:0 0 auto;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:14px}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:12px}
.sit{font-size:13px;color:var(--sub)}.goal{font-weight:700;color:var(--pri);font-size:14px;margin-bottom:4px}
.b{padding:10px 12px;border-radius:14px;margin-top:10px;max-width:88%;font-size:15px;white-space:pre-wrap}
.cu{background:var(--cu);border-bottom-left-radius:4px}
.me{background:var(--pri);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
textarea{width:100%;height:92px;border:1px solid var(--ln);border-radius:12px;padding:10px;font:inherit;font-size:15px;background:var(--bg);color:var(--tx);resize:none}
.btn{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:12px;font-size:15px;font-weight:700;width:100%;margin-top:8px}
.btn.g{background:var(--cu);color:var(--tx)}
.row{display:flex;gap:8px}
.ck{font-size:14px;margin:4px 0}.ck.y::before{content:"✅ "}.ck.n::before{content:"⬜ "}.n{color:var(--sub)}
.sc{font-size:22px;font-weight:800}.mod{font-size:14px;background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;border-left:3px solid var(--pri)}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
</style></head><body><div class="w">
<h1>🐶 단골 등록 권유 멘트 RP</h1>
<div class="tabs" id="tabs"></div>
<div class="card"><div class="goal" id="goal"></div><div class="sit" id="sit"></div><div id="chat"></div></div>
<div class="card" id="inp"><input id="nm" placeholder="이름 (결과 복사 시 포함)" style="width:100%;border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px;font:inherit;font-size:15px;background:var(--bg);color:var(--tx)"><textarea id="ta" placeholder="고객에게 건넬 멘트를 입력해 보세요"></textarea>
<button class="btn" id="go">멘트 전달하기</button><div class="hint">💡 고객 이익 + “저희 매장 단골” + 질문형 마무리</div></div>
<div class="card" id="fb" hidden></div>
<div class="card" id="dash" hidden><button class="btn g" id="dbtn">📊 결과 모아보기 (관리자)</button><div id="dres"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const S=[
{t:"🛍️ 판매 고객",goal:"판매 고객은 100% 단골 등록한다",sit:"휴대폰 구매·개통 절차를 마치고 개통된 기기를 확인하는 고객입니다.",cu:"",
c:[["요금제·혜택 안내, 기기 변경·불편사항 도움 언급",/요금제|혜택|안내|기기|불편/],["‘도와드릴 수 있다’는 고객 이익 표현",/도와|편하게|챙겨|케어/],["‘저희 매장 단골’ 등록 제안",/단골/]],
m:"고객님, 다음에 요금제나 혜택 안내, 기기 변경이나 불편사항도 편하게 도와드릴 수 있도록 저희 매장 단골로 등록해드릴까요?"},
{t:"🚶 내방 고객",goal:"요금제·부가서비스를 함께 점검하고 단골 등록을 권유한다",sit:"필름이나 액세서리를 보려고 매장에 들른 고객이 제품을 둘러보고 있습니다.",cu:"",
c:[["‘오신 김에’ 등 자연스러운 점검 제안",/오신 김에|들르신 김에|잠깐|같이|함께/],["요금제·부가서비스 점검",/요금제|부가서비스|부가 서비스/],["약정 만료·불필요 가입 확인 혜택",/약정|불필요|가입/],["‘저희 매장 단골’ 등록 제안",/단골/]],
m:"오신 김에 지금 쓰시는 요금제랑 부가서비스도 같이 봐드릴게요. 저희 매장 단골로 등록해두시면 약정이 끝날 때나 불필요하게 가입된 부가서비스가 있는지도 같이 확인해드릴 수 있어요. 등록해드릴까요?"},
{t:"👥 동행 고객",goal:"동행 고객에게도 통신사를 확인하고 간단한 서비스로 권유한다",sit:"구매 고객과 함께 온 지인이 옆에서 휴대폰을 만지며 기다리고 있습니다.",cu:"",
c:[["통신사 확인 질문",/통신사|사용하세요|쓰세요/],["필름 교체·간단 점검 등 가벼운 서비스 제안",/필름|점검|교체/],["다음 방문 시 혜택 언급",/다음|편하게|도움/],["‘저희 매장 단골’ 등록 제안",/단골/]],
m:"고객님도 필름 한번 봐드릴까요? 지금 어느 통신사 사용하세요? 저희 매장 단골로 등록해두시면 다음에 오셨을 때도 간단한 점검이나 필름 교체 같은 도움 편하게 받으실 수 있어요. 등록해드릴까요?"},
{t:"👨‍👩‍👧 가족 확인",goal:"가족 통신 현황을 확인해 등록 대상을 넓힌다",sit:"단골 등록까지 마친 고객과 대화 중입니다. 가족의 통신 현황도 확인해 보세요.",cu:"",
c:[["가족의 통신사 질문",/가족/],["통신사·인터넷 결합 혜택 언급",/결합|인터넷|혜택|통신사/],["사용 현황 확인 제안",/현황|확인|봐드/],["질문형 마무리",/[?？]|까요/]],
m:"가족분들은 어느 통신사 사용하세요? 가족끼리 통신사나 인터넷을 함께 사용하면 받을 수 있는 결합 혜택이 있을 수 있거든요. 가족분들 사용 현황도 같이 한번 확인해드릴까요?"}];
const $=i=>document.getElementById(i);let cur=0;
const R={hi:["아, 그런 게 있군요. 그럼 등록해 주세요!","좋네요, 편하게 도움받을 수 있으면 저도 좋죠. 해주세요."],
mid:["음… 등록하면 연락 많이 오는 건 아니죠? 조금 고민되네요.","굳이 등록해야 하나요? 어떤 점이 좋은지 한 번만 더 알려주세요."],
lo:["아뇨, 괜찮아요. 다음에 올게요.","그냥 필요하면 그때 올게요."]};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function bub(c,t){const d=document.createElement("div");d.className="b "+c;d.textContent=t;$("chat").appendChild(d)}
function load(i){cur=i;const s=S[i];$("goal").textContent=s.goal;$("sit").textContent=s.sit;$("chat").innerHTML="";if(s.cu)bub("cu",s.cu);
$("ta").value="";$("inp").hidden=false;$("fb").hidden=true;
$("tabs").innerHTML="";S.forEach((x,k)=>{const b=document.createElement("button");b.className="tab"+(k==i?" on":"");b.textContent=x.t;b.onclick=()=>load(k);$("tabs").appendChild(b)})}
$("go").onclick=async()=>{const v=$("ta").value.trim();if(!v)return;const s=S[cur];let ai=null;if(AI){$("go").disabled=true;$("go").textContent="Claude가 채점 중…";try{ai=await judge(s,v)}catch(e){ai=null}$("go").disabled=false;$("go").textContent="멘트 전달하기"}
let rs=s.c.map(([l,r])=>[l,r.test(v)]);const q=/[?？]|까요|세요$/.test(v);rs.push(["질문형으로 마무리",q]);
let n=rs.filter(x=>x[1]).length,p=Math.round(n/rs.length*100);if(ai){rs=ai.criteria.map(c=>[c.label+(c.comment?" — "+c.comment:""),!!c.met]);n=rs.filter(x=>x[1]).length;p=Math.max(0,Math.min(100,Math.round(ai.score)))}
bub("me",v);bub("cu",(ai&&ai.reply)||pick(p>=80?R.hi:p>=50?R.mid:R.lo));
$("inp").hidden=true;const f=$("fb");f.hidden=false;
f.innerHTML='<div class="sc">'+p+'점 <span class="sit">('+n+'/'+rs.length+')</span></div>'+rs.map(x=>'<div class="ck '+(x[1]?"y":"n")+'">'+x[0]+'</div>').join("")+
'<div class="mod"><b>예시 멘트</b><br>“'+s.m+'”'+(ai?'<br><br><b>💬 Claude 피드백</b><br>'+esc(ai.feedback)+'<br><br><b>✨ 개선 예시</b><br>“'+esc(ai.improved)+'”':'')+'</div><button class="btn g" id="cp">📋 결과 복사해서 보내기</button><div id="cpo"></div><button class="btn g" id="im">📤 이미지로 바로 공유</button><div id="imo"></div><div class="row"><button class="btn g" id="re">다시 하기</button><button class="btn" id="nx">다음 유형 ▶</button></div>'+
'<div class="hint" id="sv"></div><div class="hint">'+(ai?"※ Claude가 워크시트 취지를 기준으로 평가했어요. 표현이 달라도 취지가 맞으면 OK!":"※ 키워드 기반 간이 채점입니다. 표현이 달라도 취지가 맞으면 OK!")+'</div>';
$("cp").onclick=async()=>{const t="이름: "+($("nm").value.trim()||"(미입력)")+"\n["+s.t+"] "+p+"점\n멘트: "+v+(ai?"\n\nClaude 피드백: "+ai.feedback+"\n개선 예시: "+ai.improved:"");const o=$("cpo");try{await navigator.clipboard.writeText(t);o.innerHTML="";o.appendChild(el("div","✅ 복사됐어요. 카톡·메일에 붙여넣어 보내주세요.","font-size:13px;margin-top:6px"))}catch(e){o.innerHTML="";const a=el("textarea");a.value=t;a.readOnly=true;a.style.marginTop="8px";o.appendChild(el("div","아래 글을 길게 눌러 복사해 주세요.","font-size:13px;margin-top:6px"));o.appendChild(a);a.focus();a.select()}};
const mk=async()=>{
if(!window.html2canvas)throw 0;
const c=el("div","","position:absolute;left:-9999px;top:0;width:360px;padding:16px;background:#fff;color:#25203a;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;line-height:1.5");
const add=(t,st)=>c.appendChild(el("div",t,st));
add("🐶 단골 등록 권유 멘트 RP","font-weight:800;font-size:16px;color:#6c4ce0");
add(($("nm").value.trim()||"(이름 미입력)")+" · "+s.t,"margin-top:4px;font-weight:700");
add(p+"점","font-size:26px;font-weight:800;margin:6px 0");
rs.forEach(x=>add((x[1]?"✅ ":"⬜ ")+x[0],"margin:3px 0;font-size:13px"));
add("내 멘트","font-weight:700;margin-top:10px");add(v,"background:#f1ebfb;border-radius:10px;padding:8px;white-space:pre-wrap");
if(ai){add("💬 Claude 피드백","font-weight:700;margin-top:10px");add(ai.feedback);add("✨ 개선 예시","font-weight:700;margin-top:10px");add(ai.improved)}
document.body.appendChild(c);
const cv=await html2canvas(c,{scale:2,backgroundColor:"#ffffff"});c.remove();
const bl=await new Promise(r=>cv.toBlob(r,"image/png"));
return {bl,url:cv.toDataURL("image/png")}};
const pre=mk().catch(()=>null);
$("im").onclick=async()=>{const o=$("imo");o.textContent="준비 중…";const r=await pre;if(!r){o.textContent="이미지 생성에 실패했어요. 휴대폰 화면 캡처를 이용해 주세요.";return}
const f2=new File([r.bl],"단골등록RP결과.png",{type:"image/png"});
try{if(navigator.canShare&&navigator.canShare({files:[f2]})){await navigator.share({files:[f2],title:"단골 등록 RP 결과"});o.textContent="";return}}catch(e){if(e&&e.name==="AbortError"){o.textContent="";return}}
try{await navigator.clipboard.write([new ClipboardItem({"image/png":r.bl})]);o.textContent="✅ 이미지가 복사됐어요. 카톡 등 입력창을 길게 눌러 '붙여넣기' 해 주세요.";return}catch(e){}
o.innerHTML="";const img=document.createElement("img");img.src=r.url;img.style.cssText="width:100%;margin-top:8px;border-radius:10px;border:1px solid var(--ln)";o.appendChild(img);
o.appendChild(el("div","이 환경에서는 바로 공유가 막혀 있어요. 이미지를 길게 눌러 저장·공유해 주세요.","font-size:13px;margin-top:6px"));
try{const dl=await claude.use("downloads");if(dl)await dl.save({filename:"단골등록RP결과.png",data:r.bl})}catch(e){}
};
$("re").onclick=()=>load(cur);$("nx").onclick=()=>load((cur+1)%S.length);f.scrollIntoView({behavior:"smooth"});try{save(cur,v,p)}catch(e){}};
let db,usr,me,mine=[],AI=null;
function esc(t){return String(t==null?"":t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[c])}
async function judge(s,v){const r=await AI.json(`당신은 통신 매장 판매 교육 강사입니다. 교육생의 '단골 등록 권유 멘트'를 평가하세요.
워크시트 예시는 참고용일 뿐 정답이 아닙니다. 표현이 달라도 취지(고객에게 돌아가는 이익 설명, 부담 없고 자연스러운 톤, '저희 매장 단골' 등록 제안, 질문형 마무리)를 충족하면 인정하고, 상황 적합성·자연스러움·고객 입장까지 종합 판단하세요. 지나치게 짧거나 상황과 무관하면 낮게 평가하세요.

상황: ${s.sit}
유형 목표: ${s.goal}
워크시트 예시(참고용): ${s.m}
교육생 멘트: ${v}

JSON만 출력하세요(설명·코드블록 금지): {"score":0~100 정수,"criteria":[{"label":"평가항목","met":true또는false,"comment":"한 줄 근거"}](4~5개),"feedback":"잘한 점과 아쉬운 점 2~3문장","improved":"더 나은 멘트 1개","reply":"교육생 멘트에 대한 고객의 현실적 반응 1~2문장(점수 높으면 수락, 중간이면 망설임, 낮으면 거절)"}`,{cache:false});if(!r||!Array.isArray(r.criteria)||typeof r.score!=="number")throw 0;return r}
function save(s,t,p){const a={s,t,p,ts:Date.now()};mine.push(a);if(db&&me)db.doc("results/"+me).set({attempts:mine}).then(()=>{$("sv").textContent="✅ 결과가 저장되었어요"}).catch(()=>{$("sv").textContent="⚠️ 저장 실패 (이 화면에서만 확인 가능)"})}
function el(t,x,st){const e=document.createElement(t);if(x)e.textContent=x;if(st)e.style.cssText=st;return e}
(async()=>{try{if(!window.claude)return;try{AI=await claude.use("sample")}catch(e){}usr=await claude.use("user");db=await claude.use("db");if(!db||!usr)return;me=await usr.id();
const d=await db.doc("results/"+me).get();if(d.exists)mine=d.data().attempts||[];
if(await usr.isOwner())$("dash").hidden=false}catch(e){}})();
$("dbtn").onclick=async()=>{const o=$("dres");o.textContent="불러오는 중…";try{
const q=await db.collection("results").get();const ids=q.docs.map(d=>d.id);const ps=ids.length?await usr.profiles(ids):{};
o.textContent="";if(!q.docs.length){o.textContent="아직 제출된 결과가 없어요.";return}
q.docs.forEach(d=>{const a=(d.data().attempts||[]);const avg=a.length?Math.round(a.reduce((x,y)=>x+y.p,0)/a.length):0;
const nm=(ps[d.id]&&ps[d.id].name)||"참가자";const dt=el("details","","margin-top:10px;border-top:1px solid var(--ln);padding-top:8px");
dt.appendChild(el("summary",nm+" · "+a.length+"회 · 평균 "+avg+"점","font-weight:700;font-size:14px"));
a.slice().reverse().forEach(x=>{const r=el("div","","font-size:13px;margin-top:8px");r.appendChild(el("b",(S[x.s]?S[x.s].t:"")+" · "+x.p+"점 · "+new Date(x.ts).toLocaleString("ko-KR")));r.appendChild(el("div",x.t,"white-space:pre-wrap;color:var(--sub)"));dt.appendChild(r)});o.appendChild(dt)})
}catch(e){o.textContent="불러오기 실패: "+(e.message||e.code||"")}};
load(0);
</script></body></html>
